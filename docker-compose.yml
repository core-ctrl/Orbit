services:
  orbit-backend:
    build:
      context: ../Orbit-Backend
    ports:
      - "8000:8000"
    environment:
      ORBIT_SECRET: ${ORBIT_SECRET:-change-this-before-exposure}
      ORBIT_ADMIN_PASSWORD: ${ORBIT_ADMIN_PASSWORD:-orbit}
      ORBIT_CORS_ORIGINS: ${ORBIT_CORS_ORIGINS:-http://localhost:3001}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/orbit.db}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../Orbit-Backend/orbit.config.yaml:/app/orbit.config.yaml
      - orbit-data:/app/data
    restart: unless-stopped

  orbit-frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:8000}
    ports:
      - "3001:3000"
    depends_on:
      - orbit-backend
    restart: unless-stopped

volumes:
  orbit-data:
