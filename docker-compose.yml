services:
  orbit-backend:
    build:
      context: ../Orbit-Backend
    ports:
      - "8000:8000"
    environment:
      ORBIT_SECRET: ${ORBIT_SECRET:-change-this-before-exposure}
      JWT_SECRET: ${ORBIT_SECRET:-change-this-before-exposure}
      ORBIT_ADMIN_PASSWORD: ${ORBIT_ADMIN_PASSWORD:-orbit}
      ORBIT_CORS_ORIGINS: ${ORBIT_CORS_ORIGINS:-http://localhost:3001}
      ORBIT_PUBLIC_URL: ${ORBIT_PUBLIC_URL:-http://localhost:8000}
      ORBIT_FRONTEND_URL: ${ORBIT_FRONTEND_URL:-http://localhost:3001}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./data/orbit.db}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../Orbit-Backend/orbit.config.yaml:/app/orbit.config.yaml
      - orbit-data:/app/data
    restart: unless-stopped

  orbit-observability:
    build:
      context: ../Orbit-Observability
    ports:
      - "8010:8010"
    environment:
      OBSERVABILITY_DATABASE_URL: ${OBSERVABILITY_DATABASE_URL:-sqlite+aiosqlite:///./data/orbit-observability.db}
      ORBIT_OBSERVABILITY_ADMIN_TOKEN: ${ORBIT_OBSERVABILITY_ADMIN_TOKEN:-orbit-dev-admin}
      OBSERVABILITY_CORS_ORIGINS: ${OBSERVABILITY_CORS_ORIGINS:-http://localhost:3001}
    volumes:
      - orbit-observability-data:/app/data
      - orbit-observability-sourcemaps:/app/uploads/sourcemaps
    restart: unless-stopped

  orbit-frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:8000}
        NEXT_PUBLIC_OBSERVABILITY_URL: ${NEXT_PUBLIC_OBSERVABILITY_URL:-http://localhost:8010}
    ports:
      - "3001:3000"
    depends_on:
      - orbit-backend
      - orbit-observability
    restart: unless-stopped

volumes:
  orbit-data:
  orbit-observability-data:
  orbit-observability-sourcemaps:
